[tool.poetry]
name = "solution-tradeoff-tool"
version = "0.1.0"
description = "CLI tool that generates structured prompt files for multi-stakeholder solution trade-off analysis with Claude."
authors = ["Jan van den Brand <janvandenbrand@gmail.com>"]
readme = "README.md"
packages = [{include = "solution_tradeoff", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1"
openpyxl = "^3.1"
jinja2 = "^3.1"
pyyaml = "^6.0"
jsonschema = "^4.21"
rich = "^13.0"
anthropic = "^0.103"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
flake8 = "^7.0"
black = "^24.0"
bandit = "^1.7"
mypy = "^1.9"
types-PyYAML = "^6.0"
types-jsonschema = "^4.21"

[tool.poetry.scripts]
solution-tradeoff = "solution_tradeoff.cli:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

